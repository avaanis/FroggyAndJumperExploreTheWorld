<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Froggy and Jumper Explore the World</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐸</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LOGIN -->
  <main id="login">
    <div class="login-card">
      <div class="duo">🐸 <span>💜</span> 🦘</div>
      <h1>Froggy &amp; Jumper</h1>
      <p>explore the world</p>
      <form id="login-form">
        <input id="pw" type="password" placeholder="secret password" autocomplete="current-password" required>
        <button type="submit">Let us in</button>
      </form>
      <p id="login-error" class="error" hidden>Hmm, that's not it. Try again!</p>
    </div>
  </main>

  <!-- APP -->
  <div id="app" hidden>
    <aside id="sidebar">
      <div class="brand">🐸 Froggy &amp; Jumper 🦘</div>
      <nav id="tabs"></nav>
      <button id="new-tab" class="primary">+ New list</button>
      <div class="side-foot">
        <span id="sync-status"></span>
        <button id="logout" class="ghost">Log out</button>
      </div>
    </aside>

    <section id="workspace">
      <button id="menu-btn" class="ghost" aria-label="Toggle lists">☰</button>
      <div id="empty" hidden>
        <p>No lists yet! Make your first one 🌸</p>
      </div>
      <article id="doc" hidden>
        <input id="doc-title" placeholder="Untitled list" maxlength="60">
        <div class="toolbar">
          <button data-cmd="bold" title="Bold"><b>B</b></button>
          <button data-cmd="italic" title="Italic"><i>I</i></button>
          <button data-cmd="underline" title="Underline"><u>U</u></button>
          <button data-cmd="insertUnorderedList" title="Bullets">• List</button>
          <button id="add-check" title="Checkbox">☑ To-do</button>
          <select id="color" title="Text color">
            <option value="">Color</option>
            <option value="#e0707f">Rosy</option>
            <option value="#9b7fd1">Lavender</option>
            <option value="#5a4a6a">Plum</option>
          </select>
          <button id="delete-tab" class="ghost danger" title="Delete this list">🗑 Delete</button>
        </div>
        <div id="editor" contenteditable="true" spellcheck="true" data-placeholder="Start dreaming… places to go, dates to try, food to eat ✨"></div>
      </article>
    </section>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
  <script src="script.js"></script>
</body>
</html>
